name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      # A post committed without its preview card gets one here. The card is
      # part of the built site only; it is not committed. If this step fails,
      # the post is still published and its link preview shows the site card.
      - name: Find posts without a preview card
        id: cards
        run: echo "missing=$(node tools/og-cards.js --list-missing | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Make the missing preview cards
        if: steps.cards.outputs.missing != '0'
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node tools/og-cards.js
      - name: Build
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Check that the site is built for the /blog/ base path
        run: |
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/feed.xml
          test -f _site/sitemap.xml
          grep -q '<loc>https://ivopogace.github.io/blog/</loc>' _site/sitemap.xml
          grep -q 'href="/blog/assets/css/style.css"' _site/index.html
          test -f _site/assets/fonts/bricolage-grotesque-latin-wght-normal.woff2
          test -f _site/assets/fonts/charis-sil-latin-400-normal.woff2
          test -f _site/assets/og/default.png
          grep -q 'content="https://ivopogace.github.io/blog/assets/og/default.png"' _site/index.html
      # Fails the build when a page links to a page, section, image or file of
      # this site that does not exist. Links to other sites are not checked, so
      # an outage elsewhere cannot block a deploy.
      - name: Check internal links and images
        run: bundle exec htmlproofer _site --disable-external --swap-urls '^/blog:' --no-enforce-https
        env:
          # Without a UTF-8 locale the checker skips every page and still passes.
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
