---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title | escape }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {%- if page.published == false %} · <span class="draft">Draft, not published</span>{% endif %}
    </p>
    {%- if page.summary %}
    <p class="lede">{{ page.summary | escape }}</p>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
<p class="back"><a href="{{ '/' | relative_url }}">← All posts</a></p>
